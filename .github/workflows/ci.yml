name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore SmartPOS_ERP.slnx

      - name: Build
        run: dotnet build SmartPOS_ERP.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test SmartPOS_ERP.slnx --no-build --configuration Release
